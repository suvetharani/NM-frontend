<!DOCTYPE html>
<html>
<head>
    <title>Bill</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Product Name</th>
                <th>Quantity</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="order-table"></tbody>
        <tfoot>
            <tr>
                <td colspan="3">Total</td>
                <td id="total-amount"></td>
            </tr>
        </tfoot>
    </table>
    <button id="submit-order">Submit Order</button>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);

            const datas = urlParams.get('data');
            const details = JSON.parse(decodeURIComponent(datas));

            let sno = 1;
            let totalAmount = 0;
            const tBody = document.querySelector("#order-table");
            tBody.innerHTML = "";
            details.modifiedRows.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `<td>${sno}</td>
                                 <td>${item.productName}</td>
                                 <td>${item.qty}</td>
                                 <td>${item.amt}</td>`;
                tBody.appendChild(row); 
                sno++;
            });

            document.getElementById('total-amount').textContent = details.totalAmt.toFixed(2);

            document.getElementById('submit-order').addEventListener('click', function () {
                submitOrder(details);
            });
        });

        function submitOrder(orderDetails) {
            fetch('/order-submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(orderDetails)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                console.log('Order submitted successfully:', data);
                alert('Order submitted successfully!');
            })
            .catch(error => {
                console.error('Error submitting order:', error);
                alert('Error submitting order');
            });
        }
    </script>
</body>
</html>
