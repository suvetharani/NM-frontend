<!DOCTYPE html>
<html>
<head>
    <title>Orders</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <header>
        <pre><h1>	Order Management</h1></pre>
        <button class="nav-toggle" id="navToggle">
			<span class="bar"></span>
			<span class="bar"></span>
			<span class="bar"></span>
		</button>
    </header>
    <div class="main-container">
        <div class="navcontainer" id="navbar">
            <nav class="nav">
                <div class="nav-upper-options">
                    <div class="nav-option option2">
                        <a href="http://localhost:3000/order"><h3>Customer Orders</h3></a>
                    </div>
                    <div class="nav-option option1">
                        <a href="http://localhost:3000/intake"><h3>Order Intake</h3></a>
                    </div>
                    <div class="nav-option option3">
                        <a href="http://localhost:3000/placed"><h3>Placed Orders</h3></a>
                    </div>
                    <div class="nav-option option4">
                        <a href="http://localhost:3000/out"><h3>Order Placement</h3></a>
                    </div>
                    <div class="nav-option option5">
                        <a href="http://localhost:3000/sales"><h3>Sale Summary</h3></a>
                    </div>
                </div>
            </nav>
        </div>
        <div class="content-wrapper" id="contentWrapper">
            <div id="ordtab">
                <div>
                    <h4 style="margin-top:10px">Name: <input type="text" placeholder="Name" name="name" id="name"></h4>
				</div>
				<div>
                    <h4 style="margin-top:10px">Phone number: <input type="number" placeholder="Number" name="phno" id="phno"></h4>
                </div>
            </div>
            <div class="parent">
                <div class="boxy" onclick="fetchProducts('Chocolates')">
                    <div class="text">
                        <h2 class="topic">Chocolates</h2>
                    </div>
                </div>
                <div class="boxy" onclick="fetchProducts('Biscuits')">
                    <div class="text">
                        <h2 class="topic">Biscuits</h2>
                    </div>
                </div>
                <div class="boxy" onclick="fetchProducts('PersonalCare')">
                    <div class="text">
                        <h2 class="topic">&nbsp;&ensp;Personal &emsp;&ensp;Care</h2>
                    </div>
                </div>
                <div class="boxy" onclick="fetchProducts('Grocery')">
                    <div class="text">
                        <h2 class="topic">Grocery</h2>
                    </div>
                </div>
                <div class="boxy" onclick="fetchProducts('Toys')">
                    <div class="text">
                        <h2 class="topic">Toys</h2>
                    </div>
                </div>
                <div class="boxy" onclick="fetchProducts('IceCream')">
                    <div class="text">
                        <h2 class="topic">Ice Cream</h2>
                    </div>
                </div>
            </div>
            <table id="order-table">
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="order-table-body">
                </tbody>
            </table>
            <div id="total-amount"></div>
            <div class="button-container">
                <button id="proceedBtn" onclick="showPopup()">Proceed</button>
            </div>
        </div>
    </div>
    <script>
        fetchProducts('Chocolates');
        let modifiedRows = [];

        function fetchProducts(category) {
            fetch(`/get-products/${category}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    const tableBody = document.querySelector('#order-table-body');
                    tableBody.innerHTML = '';
                    let sno = 1;
                    data.forEach(product => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${sno}</td>
                            <td>${product.pname}</td>
                            <td>${product.pprice}</td>
                            <td><input type="number" name="qty" onchange="updateAmount(this)"></td>
                            <td></td>`;
                        tableBody.appendChild(row);
                        sno++;
                    });
                })
                .catch(error => console.error('Error fetching product data:', error));
        }

        function updateAmount(input) {
            const row = input.closest('tr');
            const quantity = input.value;
            const price = row.children[2].innerText;
            row.children[4].innerText = quantity * price;
            updateRow(row.children[1].innerText, quantity, row.children[4].innerText);
        }

        function updateRow(productName, qty, price) {
            qty = parseInt(qty);
            if (qty > 0) {
                const index = modifiedRows.findIndex(item => item.productName === productName);
                if (index !== -1) {
                    modifiedRows[index].qty = qty;
                    modifiedRows[index].amt = price;
                } else {
                    modifiedRows.push({ productName: productName, qty: qty, amt: price });
                }
            } else {
                modifiedRows = modifiedRows.filter(item => item.productName !== productName);
            }
        }

        function showPopup() {
            const name = document.getElementById('name').value;
            const phno = document.getElementById('phno').value;

            if (!name || !phno) {
                alert("Please enter both name and phone number.");
                return;
            }
            totalAmt = modifiedRows.reduce((total, item) => total + parseFloat(item.amt), 0);
            const data = {
                name: name,
                phno: phno,
                modifiedRows: modifiedRows,
                totalAmt: totalAmt
            };

            const queryString = `data=${encodeURIComponent(JSON.stringify(data))}`;
            window.open(`popup.html?${queryString}`, '_self');
        }

        document.getElementById('navToggle').addEventListener('click', function() {
            const navbar = document.getElementById('navbar');
            const contentWrapper = document.getElementById('contentWrapper');
            navbar.classList.toggle('open');
            contentWrapper.classList.toggle('nav-open');
        });
    </script>
</body>
</html>
