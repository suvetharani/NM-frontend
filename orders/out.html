<!DOCTYPE html>
<html>
<head>
    <title>Sale Summary</title>
    <link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" href="responsive.css">
</head>
<body>
    <header>
        <pre><h1>	Order Management</h1></pre>
        <button class="nav-toggle" id="navToggle">
			<span class="bar"></span>
			<span class="bar"></span>
			<span class="bar"></span>
		</button>
    </header>
    <div class="main-container">
        <div class="navcontainer" id="navbar">
            <nav class="nav">
                <div class="nav-upper-options">
                    <div class="nav-option option5">
                        <a href="http://localhost:3000/order"><h3>Customer Orders</h3></a>
                    </div>
                    <div class="nav-option option2">
                        <a href="http://localhost:3000/intake"><h3>Order Intake</h3></a>
                    </div>
                    <div class="nav-option option3">
                        <a href="http://localhost:3000/placed"><h3>Placed Orders</h3></a>
                    </div>
                    <div class="nav-option option1">
                        <a href="http://localhost:3000/out"><h3>Order Placement</h3></a>
                    </div>
                    <div class="nav-option option4">
                        <a href="http://localhost:3000/sales"><h3>Sale Summary</h3></a>
                    </div>
                </div>
            </nav>
        </div>
        <div class="content-wrapper" id="contentWrapper">
            <div class="custom-select">
                <select class="dd" id="suppliers" name="suppliers" onchange="fetchProducts()">
                    <option value="" disabled selected>Select a supplier</option>
                </select>
            </div>
            <div id="products-container" style="margin:10px">
                <h3>Products</h3>
                <table id="products-table">
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Product Name</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
                <div id="no-products-message" style="display: none; color: red;"></div>
             <div class="button-container"><button id="proceedBtn" onclick="showPopup()">Proceed</button>
            </div>
			</div>
        </div>
    </div>
    <script>
        let modifiedRows = [];

        function fetchData() {
            fetch('/supplier/data')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    const suppliersSelect = document.getElementById('suppliers');
                    suppliersSelect.innerHTML = ''; // Clear existing options
                    const placeholderOption = document.createElement('option');
                    placeholderOption.value = '';
                    placeholderOption.disabled = true;
                    placeholderOption.selected = true;
                    placeholderOption.textContent = 'Select a supplier';
                    suppliersSelect.appendChild(placeholderOption);

                    data.forEach(supplier => {
                        const option = document.createElement('option');
                        option.value = supplier.sid;
                        option.textContent = supplier.sname;
                        suppliersSelect.appendChild(option);
						
					if (supplier.sid === 1) {
						option.selected = true;
						defaultSelected = true;
						fetchProducts();
						}
                    });
                })
                .catch(error => console.error('Error fetching supplier data:', error));
        }
		
        function fetchProducts() {
            const supplierSelect = document.getElementById('suppliers');
            const sid = supplierSelect.value;

            fetch(`/products/${sid}`)
                .then(response => {
                    if (response.status === 404) {
                        throw new Error(`No products found for supplier id: ${sid}`);
                    }
                    return response.json();
                })
                .then(data => {
                    const productsTable = document.getElementById('products-table').getElementsByTagName('tbody')[0];
                    productsTable.innerHTML = '';
                    document.getElementById('no-products-message').style.display = 'none';

                    let sno = 1;
                    data.forEach(product => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${sno}</td>
                            <td>${product.pname}</td>
                            <td>${product.pprice}</td>
                            <td><input type="number" name="qty" min="0" onchange="updateAmount(this)"></td>
                            <td></td>`;
                        productsTable.appendChild(row);
                        sno++;
                    });
                })
                .catch(error => {
                    const productsTable = document.getElementById('products-table').getElementsByTagName('tbody')[0];
                    productsTable.innerHTML = '';
                    const noProductsMessage = document.getElementById('no-products-message');
                    noProductsMessage.textContent = error.message;
                    noProductsMessage.style.display = 'block';
                    console.error('Error fetching products:', error);
                });
        }

        function updateAmount(input) {
            const row = input.closest('tr');
            const quantity = input.value;
            const price = row.children[2].innerText;
            const amount = quantity * price;
            row.children[4].innerText = amount;
            updateRow(row.children[1].innerText, quantity, amount);
        }

        function updateRow(productName, qty, amt) {
            qty = parseInt(qty);
            if (qty > 0) {
                const index = modifiedRows.findIndex(item => item.productName === productName);
                if (index !== -1) {
                    modifiedRows[index].qty = qty;
                    modifiedRows[index].amt = amt;
                } else {
                    modifiedRows.push({ productName: productName, qty: qty, amt: amt });
                }
            } else {
                modifiedRows = modifiedRows.filter(item => item.productName !== productName);
            }
        }

        function showPopup() {
            const supplierSelect = document.getElementById('suppliers');
            const sid = supplierSelect.value;
            const totalAmt = modifiedRows.reduce((total, item) => total + parseFloat(item.amt), 0);
            const data = {
                modifiedRows: modifiedRows,
                totalAmt: totalAmt,
                sid: sid
            };
            const queryString = `data=${encodeURIComponent(JSON.stringify(data))}`;
            window.open(`popup1.html?${queryString}`, '_self');
        }

        document.getElementById('navToggle').addEventListener('click', function() {
            const navbar = document.getElementById('navbar');
            const contentWrapper = document.getElementById('contentWrapper');
            navbar.classList.toggle('open');
            contentWrapper.classList.toggle('nav-open');
        });

        window.onload = fetchData;
    </script>
</body>
</html>
