<!DOCTYPE html>
<html>
<head>
    <title>Products Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Products</h1>
    </header>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
        </ul>
    </nav>
    <main>
        <div class="container">
            <h1>Product Information</h1>
            <table id="product-table">
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Name</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Customer data will be appended here by JavaScript -->
                </tbody>
            </table>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Product Dashboard. All rights reserved.</p>
    </footer>

    <script>
        // JavaScript code to fetch and display customer data
        function fetchData() {
            fetch('/product/data')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    const tableBody = document.querySelector('#product-table tbody');
                    tableBody.innerHTML = ''; // Clear the table before appending new data
                    data.forEach(product => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${product.pid}</td>
                            <td>${product.pname}</td>
                            <td>${product.pprice}</td>`;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Error fetching customer data:', error));
        }

        // Fetch data when the page loads
        window.onload = fetchData;
    </script>
</body>
</html>
